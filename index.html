<!DOCTYPE html>
<html lang="en" ng-app="studentApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Student Portal</title>

    <!-- Bootstrap (CSS Framework / Strap) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            background-color: #f9fafc;
        }
        .card {
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
    </style>
</head>

<body ng-controller="studentCtrl" class="container py-5">

    <h1 class="text-center mb-4 text-primary">🎓 Dynamic Student Portal</h1>

    <!-- Form (AngularJS + Bootstrap) -->
    <div class="card p-4 mb-4">
        <h4>Add Student</h4>
        <form>
            <div class="row mb-3">
                <div class="col-md-4">
                    <input type="text" ng-model="newStudent.name" class="form-control" placeholder="Name">
                </div>
                <div class="col-md-4">
                    <input type="number" ng-model="newStudent.age" class="form-control" placeholder="Age">
                </div>
                <div class="col-md-4">
                    <input type="text" ng-model="newStudent.course" class="form-control" placeholder="Course">
                </div>
            </div>
            <button type="button" class="btn btn-success" ng-click="addStudent()">Add Student</button>
        </form>
    </div>

    <!-- Table (AngularJS + Bootstrap + jQuery animations) -->
    <div class="card p-4">
        <h4>Student List</h4>
        <table class="table table-striped">
            <thead class="table-dark">
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Course</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="studentTable">
                <tr ng-repeat="student in students">
                    <td>{{$index + 1}}</td>
                    <td>{{student.name}}</td>
                    <td>{{student.age}}</td>
                    <td>{{student.course}}</td>
                    <td>
                        <button class="btn btn-danger btn-sm removeBtn">Remove</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- AngularJS Controller -->
    <script>
        var app = angular.module("studentApp", []);
        app.controller("studentCtrl", function($scope) {
            // Default students
            $scope.students = [
                {name: "Tushar Kale", age: 21, course: "Web Development"},
                {name: "Aarav Patil", age: 22, course: "Data Science"}
            ];

            // Add new student
            $scope.addStudent = function() {
                if ($scope.newStudent.name && $scope.newStudent.age && $scope.newStudent.course) {
                    $scope.students.push($scope.newStudent);
                    $scope.newStudent = {};
                } else {
                    alert("Please fill all fields!");
                }
            };
        });

        // jQuery to animate row removal
        $(document).on('click', '.removeBtn', function() {
            $(this).closest('tr').fadeOut(500, function() {
                $(this).remove();
            });
        });
    </script>
</body>
</html>
